name: AI Raid Energy Candidate AB
on:
  pull_request:
    branches: [main]
    paths:
      - 'dist/universal-v2/ai-v3/raid-energy-candidate.mjs'
      - 'scripts/ai-raid-energy-candidate-ab-20261114.mjs'
      - '.github/workflows/ai-raid-energy-ab-20261114.yml'
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fixed 48 node held-out mirrored AB for energy raid candidate
        run: node scripts/ai-raid-energy-candidate-ab-20261114.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raid-energy-ab-shard-${{ matrix.shard }}
          path: raid-energy-ab-shard-*.json
          if-no-files-found: warn
