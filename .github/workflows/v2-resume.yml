name: V2 Resumed Integration
on:
  push:
    branches: [codex/v2-resume-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node scripts/v2-integrated-match-matrix.mjs
      - run: node scripts/v2-unported-report.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resumed-v2-match-evidence
          path: audit/v2-integrated-match-matrix.json
