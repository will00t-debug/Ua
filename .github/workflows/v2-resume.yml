name: V2 Resumed Integration
# pull_request re-runs on open, push, and reopen for PRs into the V2
# integration branch. It checks out the merge ref and uses read-only
# GITHUB_TOKEN. This file is not on main, and push is the event that runs a
# workflow before it reaches the default branch, so cursor/* and gpt/* pushes also run
# the same jobs. No pull_request_target and no repository secrets.
on:
  push:
    branches:
      - codex/v2-resume-20261021
      - 'cursor/**'
      - 'gpt/**'
  pull_request:
    branches:
      - codex/v2-resume-20261021
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v2-resume-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independent card certification ledger
        run: node scripts/v2-card-certification-report.mjs
      - name: Shared capability and unported audit
        run: node scripts/v2-r35-unported-atom-audit.mjs
      - name: R37 all-five-title TOP-N full-roster candidate audit
        run: node scripts/v2-r37-top-n-candidate-report.mjs
      - name: R40 full protection provenance candidate audit
        run: node scripts/v2-r40-protection-candidate-report.mjs
      - name: R41 free hand-entry and outside-recovery five-title audit
        run: node scripts/v2-r41-special-hand-candidate-report.mjs
      - name: R42 all five-title named free entry, TOP-N and protection rescan
        run: node scripts/v2-r42-named-zone-candidate-report.mjs
      - name: R43 full five-title source and paid MAIN effect inventory
        run: node scripts/v2-r43-main-cost-unported-report.mjs
      - name: R44 source-stamped phase-end and five-title pending official audit
        run: node scripts/v2-r44-phase-retire-candidate-report.mjs
      - name: Node 22 test suite
        run: npm test
      - name: Five-title 60-match matrix
        run: node scripts/v2-integrated-match-matrix.mjs
      - name: Independent card-id manifest
        run: node scripts/v2-assert-independent-manifest.mjs
      - name: V2 unported report
        run: node scripts/v2-unported-report.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resumed-v2-match-evidence
          path: audit/v2-integrated-match-matrix.json
