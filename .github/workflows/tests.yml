name: BLEACH Arena Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all regression tests
        run: npm test
      - name: Syntax check for browser modules
        run: |
          node --check dist/app.mjs
          node --check dist/ai-v2.mjs
          node --check dist/universal-v2-preview.mjs
          node --check dist/universal-v2/preview-actions.mjs
          node --check dist/universal-v2/preview-replay.mjs
          node --check dist/universal-v2/engine.mjs
      - name: Check static entry point
        run: |
          test -s dist/index.html
          test -s dist/app.mjs
          test -s dist/engine.mjs
          test -s dist/universal-v2-preview.html
          test -s dist/universal-v2-preview.mjs
          test -s dist/universal-v2-preview.css
          test -s dist/universal-v2/preview-replay.mjs
