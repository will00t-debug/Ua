name: BLEACH Arena Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate card audit manifest
        run: |
          node scripts/generate-card-audit.mjs
          test -s audit/bleach-card-audit.json
          test -s audit/bleach-card-audit.csv
      - name: Run all regression tests
        run: npm test
      - name: Check static entry point
        run: |
          test -s dist/index.html
          test -s dist/app.mjs
          test -s dist/engine.mjs
