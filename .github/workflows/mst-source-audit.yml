name: UA54BT research metadata probe
on:
  push:
    branches:
      - feature/mst-source-audit
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe official cardlist (read only)
        run: node scripts/mst-official-probe.mjs
