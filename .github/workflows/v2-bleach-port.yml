name: V2 BLEACH Port Checks

on:
  push:
    branches:
      - feature/v2-bleach-port-20261015
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bleach-port:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dedicated BLEACH V2 tests
        run: node --test tests/universal-v2-bleach-port.test.mjs
      - name: All repository regression tests
        run: npm test
      - name: Syntax of isolated BLEACH module
        run: node --check dist/universal-v2/bleach-pack.mjs

  latest-v2-integration:
    name: Simulated integration with current PR70 V2 HEAD
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: bleach-port
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Make clean temporary merge commit in CI runner only (NO PUSH)
        run: |
          git fetch origin feature/universal-rules-v2-foundation-20261014
          git -c user.name='V2-B CI' -c user.email='ci@example.invalid' merge --no-ff -m 'Temporary CI-only merge of latest V2; NEVER PUSH' origin/feature/universal-rules-v2-foundation-20261014
          test -z "$(git status --porcelain)"
      - name: Real BLEACH tests on latest integrated core
        run: node --test tests/universal-v2-bleach-port.test.mjs tests/universal-v2-bleach-green-match.test.mjs tests/universal-v2-bleach-enemy-control.test.mjs
      - name: Full regression suite on latest integrated core
        run: npm test
