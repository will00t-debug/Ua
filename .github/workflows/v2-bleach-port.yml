name: V2 BLEACH Port Checks

on:
  push:
    branches:
      - feature/v2-bleach-port-20261015
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bleach-registry:
    name: BLEACH formal registry / real-card V2 acceptance gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: BLEACH dedicated tests including official title registry and actual AI games
        run: |
          node --test tests/universal-v2-bleach-port.test.mjs \
            tests/universal-v2-bleach-green-match.test.mjs \
            tests/universal-v2-bleach-enemy-control.test.mjs \
            tests/universal-v2-bleach-top-inspect.test.mjs \
            tests/universal-v2-bleach-core-gaps.test.mjs \
            tests/universal-v2-bleach-registry.test.mjs \
            tests/universal-v2-bleach-nc-batch.test.mjs \
            tests/universal-v2-bleach-own-buff.test.mjs \
            tests/universal-v2-bleach-new-top.test.mjs
      - name: BLEACH syntax and source-only contribution structure
        run: |
          node --check dist/universal-v2/bleach-pack.mjs
          node --check dist/universal-v2/title-packs/bleach.mjs

  latest-v2-integration:
    name: BLEACH registry + live V2 common engine checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: bleach-registry
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync-check latest V2 master branch without pushing
        run: |
          git fetch origin feature/universal-rules-v2-foundation-20261014
          git -c user.name='V2-B CI' -c user.email='ci@example.invalid' merge --no-ff -m 'Runner-only PR70 synchronization; NEVER PUSH' origin/feature/universal-rules-v2-foundation-20261014
          test -z "$(git status --porcelain)"
      - name: Registry and BLEACH engine test suites on latest A
        run: |
          node --test tests/universal-v2-bleach-port.test.mjs \
            tests/universal-v2-bleach-green-match.test.mjs \
            tests/universal-v2-bleach-enemy-control.test.mjs \
            tests/universal-v2-bleach-top-inspect.test.mjs \
            tests/universal-v2-bleach-core-gaps.test.mjs \
            tests/universal-v2-bleach-registry.test.mjs \
            tests/universal-v2-bleach-nc-batch.test.mjs \
            tests/universal-v2-bleach-own-buff.test.mjs \
            tests/universal-v2-bleach-new-top.test.mjs
      - name: General V2 mechanics used by BLEACH, without known upstream hardcoded count failures
        run: |
          node --test tests/universal-v2-core.test.mjs \
            tests/universal-v2-ability-templates.test.mjs \
            tests/universal-v2-color-active.test.mjs \
            tests/universal-v2-special-color-raid.test.mjs \
            tests/universal-v2-mass-retire-turn-buff.test.mjs \
            tests/universal-v2-compound-top-inspection.test.mjs

  full-repository-regression:
    name: All repository regression tests on synchronized PR70 core
    needs: bleach-registry
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
