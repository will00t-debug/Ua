name: Solo Leveling art source audit
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Rugiacreation card source and ordinary images
        run: |
          node --input-type=module <<'NODE'
          const pages=[
           'https://rugiacreation.com/ua/search?Name=HK&Version=SLG',
           'https://rugiacreation.com/ua/search?Find1=SLG-1-001&Name=HK'
          ];
          for(const url of pages) {
           try {
            const res=await fetch(url,{headers:{'User-Agent':'Mozilla/5.0 (compatible; ua-art-audit/1.0)'},signal:AbortSignal.timeout(15000)});
            const html=await res.text();
            console.log('SOURCE',url,'STATUS',res.status,'LEN',html.length);
            for(const target of ['SLG-1-001','SLG-1-040','SLG-1-080']){
             const p=html.indexOf(target);console.log('CARD',target,'INDEX',p,'SAMPLE',p>=0?html.slice(Math.max(0,p-160),p+440).replace(/\s+/g,' ').slice(0,600):'none');
            }
            const paths=html.split("data-src='").slice(1).map(x=>x.split("'")[0]).filter(x=>x.includes('SLG-1-'));
            console.log('ALL_IMAGE_SOURCE_PATHS',paths.length);
            console.log('IMAGE_PATH_SAMPLES',JSON.stringify(paths.slice(0,13)));
            const ordinary=paths.filter(x=>x.includes('/UA51BT_SLG-1-')&&x.split('?')[0].endsWith('.jpg')&&!x.split('?')[0].includes('_2.')&&!x.split('?')[0].includes('_3.'));
            const unique=new Set(ordinary.map(x=>x.split('SLG-1-')[1].slice(0,3)));
            const missing=Array.from({length:80},(_,i)=>String(i+1).padStart(3,'0')).filter(i=>!unique.has(i));
            console.log('ORDINARY_COUNT',unique.size,'MISSING',missing.join(',')||'none');
           }catch(err){console.log('SOURCE_ERROR',url,err.message);}
          }
          for(const path of ['UA51BT_SLG-1-001.jpg','UA51BT_SLG-1-040.jpg','UA51BT_SLG-1-080.jpg']){
           try {
            const res=await fetch('https://rugiacreation.com/ua/cardlist/small/'+path+'?v=20261013',{headers:{Range:'bytes=0-50'},signal:AbortSignal.timeout(9000)});
            console.log('IMAGE_CHECK',path,res.status,res.headers.get('content-type'),res.headers.get('content-length'));res.body?.cancel();
           }catch(err){console.log('IMAGE_ERROR',path,err.message);}
          }
          NODE
