name: White Sword browser opt-in smoke

on:
  push:
    branches:
      - feat/white-sword-v2-production-optin-20261122
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: |
          node --check dist/universal-v2-preview.mjs
          node --check dist/universal-v2/white-sword-ai/browser-model.mjs
          node --check dist/universal-v2/white-sword-ai/browser-entry.mjs
          node --check dist/universal-v2/white-sword-ai/browser-worker.mjs
          node --test tests/white-sword-browser-optin.test.mjs tests/white-sword-specialist.test.mjs
      - run: |
          npm ci
          npm run worker:build
