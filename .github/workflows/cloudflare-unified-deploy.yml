name: Deploy unified UA V2 to existing Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'dist/online.mjs'
      - 'dist/online.html'
  workflow_dispatch:
    inputs:
      worker_name:
        description: 'Confirm the EXISTING worker name: ua-arena'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ua-arena-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || github.event.inputs.worker_name == 'ua-arena' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check existing Worker target, credentials and bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Set CLOUDFLARE_API_TOKEN in GitHub Actions secrets first"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Set CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets first"; exit 1; }
          node --input-type=module -e "import fs from 'node:fs'; const config=JSON.parse(fs.readFileSync('wrangler.jsonc'));if(config.name!=='ua-arena'||config.durable_objects?.bindings?.find(x=>x.name==='ACCOUNTS')?.class_name!=='AccountBook'||config.durable_objects?.bindings?.find(x=>x.name==='ROOMS')?.class_name!=='MatchRoom')process.exit(1)"
      - name: Install and run full regressions
        run: |
          npm ci
          npm test
      - name: Bundle Worker and static picture-style editor
        run: npm run worker:build
      - name: Deploy to SAME Cloudflare Worker / Durable Objects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler deploy
