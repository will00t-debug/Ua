name: Deploy unified UA V2 to existing Cloudflare Worker

# GPT-direct production deploy (no Cursor required):
# - Merge a green PR into main that touches Worker/site paths → this workflow
#   runs tests, then deploys the EXISTING Worker ua-arena.
# - Or run workflow_dispatch with worker_name=ua-arena and
#   durable_objects_policy=preserve.
# Secrets stay in GitHub Actions only; never print CLOUDFLARE_* values.
# Do not delete or rename Durable Object classes/data.
on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'worker/**'
      - 'server/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/cloudflare-deploy-preflight.mjs'
      - 'scripts/build-worker.mjs'
      - '.github/workflows/cloudflare-unified-deploy.yml'
  workflow_dispatch:
    inputs:
      worker_name:
        description: 'Confirm the EXISTING worker name: ua-arena'
        required: true
        type: string
      durable_objects_policy:
        description: 'Must be: preserve (never delete AccountBook / MatchRoom data)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ua-arena-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.worker_name == 'ua-arena' &&
       github.event.inputs.durable_objects_policy == 'preserve')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check existing Worker target, credentials and Durable Object bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node scripts/cloudflare-deploy-preflight.mjs
      - name: Install and run full regressions
        run: |
          npm ci
          npm test
      - name: Bundle Worker and static picture-style editor
        run: npm run worker:build
      - name: Deploy to SAME Cloudflare Worker / Durable Objects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Do not echo env; Wrangler reads CLOUDFLARE_* from the environment.
          npx --yes wrangler deploy
