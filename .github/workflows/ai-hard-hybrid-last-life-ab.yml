name: AI Last Life Guard A-B Benchmark
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ai-hard-hybrid-last-life-ab-20261114.mjs'
      - 'dist/universal-v2/ai-v3/last-life-guard.mjs'
      - '.github/workflows/ai-hard-hybrid-last-life-ab.yml'
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare current Hybrid versus last life candidate in 400 matches
        run: node scripts/ai-hard-hybrid-last-life-ab-20261114.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-last-life-ab-shard-${{ matrix.shard }}
          path: ai-last-life-ab-shard-*.json
          if-no-files-found: warn
