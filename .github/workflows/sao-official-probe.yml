name: SAO official catalog import
on:
  push:
    branches: ['feature/sword-art-online']
    paths:
      - '.github/workflows/sao-official-probe.yml'
      - 'scripts/fetch-sao-official.mjs'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sword-art-online
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch and audit official card details
        run: node scripts/fetch-sao-official.mjs
      - name: Commit verified source data only on this feature branch
        run: |
          git add dist/sao-official-import.mjs dist/sao-official-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data(sao): import verified official JP card details'
          git push origin HEAD:feature/sword-art-online
