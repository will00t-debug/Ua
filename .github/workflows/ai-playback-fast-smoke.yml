name: AI playback speed smoke

on:
  push:
    branches: [feat/ai-fast-playback-20261122]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check dist/universal-v2-preview.mjs
          node --check dist/universal-v2/ai-playback-speed.mjs
      - name: Playback, mobile recovery and UI-source regressions
        run: |
          node --test tests/ai-playback-speed.test.mjs tests/v2-mobile-ai-manual-rescue.test.mjs tests/v2-mobile-ai-stall-and-resume.test.mjs tests/v2-opening-mulligan-mobile-stall.test.mjs tests/ai-policy-display.test.mjs tests/v2-eva-battle-art.test.mjs
