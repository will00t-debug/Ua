# Manual White Sword v4-A evolution.
# GitHub runs a scheduled workflow only from the default branch, so this
# experiment branch stays on workflow_dispatch. A later pull request can add
# the schedule after review. That request must not change the live AI or deploy.
name: White Sword v4-A evolution

on:
  workflow_dispatch:
    inputs:
      profile:
        description: round 跑完整輪，smoke 只檢查閉環
        type: choice
        options:
          - round
          - smoke
        default: round
      rounds:
        description: 連續輪數。只接受 1、3、5。時間或安全問題會停。
        type: choice
        options:
          - '1'
          - '3'
          - '5'
        default: '1'
      workers:
        description: 平行對戰 worker 上限，最多 4
        type: string
        default: '3'

permissions:
  contents: write

concurrency:
  group: white-sword-v4a
  cancel-in-progress: false

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: v4-A unit tests
        run: node --test tests/white-sword-v4a.test.mjs
      - name: Evolve
        env:
          PROFILE: ${{ inputs.profile }}
          ROUNDS: ${{ inputs.rounds }}
          WS_WORKERS: ${{ inputs.workers }}
          WS_STATE_BRANCH: cursor/white-sword-v4a-state-c159
        run: |
          if [ "$PROFILE" = "smoke" ]; then
            node scripts/white-sword-v4a.mjs smoke
          elif [ "$ROUNDS" = "1" ]; then
            node scripts/white-sword-v4a.mjs round
          else
            node scripts/white-sword-v4a.mjs rounds "$ROUNDS"
          fi
      - name: Upload evolution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: white-sword-v4a-${{ inputs.profile }}-${{ github.run_id }}
          path: |
            training/white-sword-ai/v4a
            docs/white-sword-ai/v4a
          if-no-files-found: warn
