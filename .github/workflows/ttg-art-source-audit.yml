name: TTG image source audit
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check RUGIA external card image structure (read-only)
        run: |
          node --input-type=module <<'NODE'
          const urls=[
            'https://rugiacreation.com/ua/search?Name=HK&Version=TTG',
            'https://rugiacreation.com/ua/search?Find1=TTG-1-001&Name=HK',
          ];
          for(const url of urls){
            try{
              const res=await fetch(url,{headers:{'User-Agent':'Mozilla/5.0 (compatible; UA-card-source-check/1.0)'} ,signal:AbortSignal.timeout(18000)});
              const html=await res.text(); 
              console.log('SOURCE',url,'STATUS',res.status,'LEN',html.length);
              for(const n of ['TTG-1-001','TTG-1-032','TTG-1-081']){
                const idx=html.indexOf(n);
                console.log('MATCH',n,idx,idx>=0?html.slice(Math.max(0,idx-200),idx+550).replace(/\s+/g,' ').slice(0,720):'');
              }
              const matches=html.split(/\\n/).filter(row=>row.includes('cardlist/small')||row.includes('TTG-1-001')||row.includes('TTG-1-032')).slice(0,8);
              console.log('IMAGE_MATCHES',JSON.stringify(matches.map(row=>row.slice(0,800))));
              if(url.includes('Version=TTG')){
                const ids=new Set([...html.matchAll(/data-src=['"]cardlist\\/small\\/UA56BT_TTG-1-(\\d{3})\\.jpg/g)].map(m=>m[1]));
                const missing=Array.from({length:81},(_,i)=>String(i+1).padStart(3,'0')).filter(n=>!ids.has(n));
                console.log('STANDARD_ARTWORK_COVERAGE',ids.size,'MISSING',missing.join(',')||'none');
              }
            }catch(e){console.log('SOURCE_ERROR',url,String(e));}
          }
          for(const path of ['UA56BT_TTG-1-001.jpg','UA56BT_TTG-1-001_1.jpg','UA56BT_TTG-1-032.jpg','UA56BT_TTG-1-032_1.jpg','UA56BT_TTG-1-032_2.jpg']){
            const url='https://rugiacreation.com/ua/cardlist/small/'+path+'?v=20261013';
            try{
              const r=await fetch(url,{method:'GET',headers:{Range:'bytes=0-50'},signal:AbortSignal.timeout(9000)});
              console.log('IMAGE_CHECK',path,r.status,r.headers.get('content-type'),r.headers.get('content-length'));r.body?.cancel();
            }catch(e){console.log('IMAGE_ERROR',path,String(e));}
          }
          NODE
